<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual Similarity Search</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='14' cy='14' r='9' fill='none' stroke='%23FF4B4B' stroke-width='4'/><path d='M21 21l7 7' stroke='%23FF4B4B' stroke-width='4' stroke-linecap='round'/></svg>">
<style>
  :root {
    --bg: #ffffff;
    --surface: #f5f6f8;
    --ink: #1e2228;
    --muted: #5f6670;
    --line: #e2e5ea;
    --accent: #ff4b4b;
    --accent-ink: #ffffff;
    --accent-soft: #fff0f0;
    --danger-bg: #fdf1f1;
    --danger-ink: #8f1d1d;
    --radius: 10px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15181d;
      --surface: #1f2329;
      --ink: #eef0f3;
      --muted: #a2a9b3;
      --line: #313740;
      --accent: #ff5c5c;
      --accent-ink: #ffffff;
      --accent-soft: #3a2124;
      --danger-bg: #3a2124;
      --danger-ink: #ffc9c9;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .page { max-width: 1180px; margin: 0 auto; padding: 40px 24px 64px; }

  /* ---------- header ---------- */
  header {
    display: flex; flex-wrap: wrap; align-items: baseline;
    justify-content: space-between; gap: 8px 24px; margin-bottom: 28px;
  }
  h1 { margin: 0; font-size: 2rem; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em; }
  .tagline { margin: 6px 0 0; color: var(--muted); }
  .status { color: var(--muted); font-size: 0.875rem; white-space: nowrap; }
  .status strong { color: var(--ink); font-weight: 600; }

  /* ---------- tabs ---------- */
  /* The divider is an inset shadow rather than a border, so the active tab's
     underline sits on top of it without making the row overflow (which
     Windows shows as a stray scrollbar). */
  .tabs {
    display: flex; gap: 4px; margin-bottom: 24px;
    box-shadow: inset 0 -1px 0 var(--line);
    overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    background: none; border: 0; padding: 10px 14px; cursor: pointer;
    color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  /* ---------- inputs ---------- */
  .query-row { display: flex; gap: 10px; }
  .query {
    flex: 1; min-width: 0; height: 56px; padding: 0 18px;
    font-size: 1.25rem; background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius);
  }
  .query::placeholder { color: var(--muted); }
  .query:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .btn {
    height: 56px; padding: 0 24px; border-radius: var(--radius); cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border: 0; font-weight: 600;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .btn.secondary { background: var(--surface); color: var(--ink); border: 1px solid var(--line); height: 44px; }

  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; color: var(--muted); font-size: 0.875rem; align-items: center; }
  .chip {
    border: 1px solid var(--line); background: var(--bg); border-radius: 999px;
    padding: 4px 12px; cursor: pointer; color: var(--ink);
  }
  .chip:hover { border-color: var(--accent); }

  .drop {
    display: flex; align-items: center; gap: 18px; width: 100%;
    padding: 18px; border: 1.5px dashed var(--line); border-radius: var(--radius);
    background: var(--surface); cursor: pointer; text-align: left;
  }
  .drop:hover, .drop.dragging { border-color: var(--accent); }
  .drop img { width: 88px; height: 88px; object-fit: cover; border-radius: 8px; flex: none; }
  .drop .placeholder {
    width: 88px; height: 88px; border-radius: 8px; flex: none;
    display: grid; place-items: center; background: var(--bg); border: 1px solid var(--line); color: var(--muted);
  }
  .drop-title { font-weight: 600; font-size: 1.05rem; }
  .drop-hint { color: var(--muted); font-size: 0.875rem; }

  .options {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px;
    margin-top: 16px; color: var(--muted); font-size: 0.875rem;
  }
  .options label { display: inline-flex; align-items: center; gap: 8px; }
  .options select {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px;
  }
  .segmented { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .segmented button { background: var(--bg); border: 0; padding: 4px 12px; cursor: pointer; color: var(--muted); }
  .segmented button + button { border-left: 1px solid var(--line); }
  .segmented button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  input[type="range"] { accent-color: var(--accent); width: 200px; }
  input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
  .threshold-value { color: var(--ink); font-variant-numeric: tabular-nums; min-width: 2.5em; }

  /* ---------- results ---------- */
  .summary { margin: 28px 0 12px; color: var(--muted); font-size: 0.875rem; min-height: 1.5em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
  .tile { margin: 0; }
  .tile button { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; border-radius: var(--radius); }
  .tile img {
    display: block; width: 100%; aspect-ratio: 1; object-fit: cover;
    border-radius: var(--radius); background: var(--surface);
  }
  .tile figcaption { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; font-size: 0.8125rem; }
  .tile .name { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .score { font-variant-numeric: tabular-nums; flex: none; }

  .group { margin-bottom: 32px; }
  .group h2 { font-size: 1rem; margin: 0 0 10px; font-weight: 600; }

  .notice { padding: 14px 16px; border-radius: var(--radius); background: var(--surface); color: var(--muted); }
  .notice.error { background: var(--danger-bg); color: var(--danger-ink); }
  .notice code { font-size: 0.875em; }
  #unavailable { margin-bottom: 16px; }

  .loading { display: inline-flex; align-items: center; gap: 10px; }
  .spinner {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--line); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- viewer ---------- */
  dialog {
    border: 0; padding: 0; background: transparent; max-width: min(92vw, 1100px); max-height: 92vh;
  }
  dialog::backdrop { background: rgba(10, 12, 16, 0.82); }
  dialog img { display: block; max-width: 100%; max-height: 82vh; border-radius: 8px; margin: 0 auto; }
  .viewer-bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; color: #e9ecf0; padding: 10px 2px 0; font-size: 0.875rem; }
  .viewer-bar button { background: none; border: 1px solid #5a616b; color: #e9ecf0; border-radius: 8px; padding: 4px 12px; cursor: pointer; }

  footer { margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.8125rem; }
  footer a { color: var(--muted); }
  footer a:hover { color: var(--accent); }

  .hidden { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 600px) {
    .page { padding: 24px 16px 48px; }
    h1 { font-size: 1.6rem; }
    .query-row { flex-direction: column; }
    .query { flex: none; }
    .btn { width: 100%; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <div>
      <h1>Visual Similarity Search</h1>
      <p class="tagline">Find photos by describing them, or by showing an example.</p>
    </div>
    <div class="status" id="status" aria-live="polite">Loading collection…</div>
  </header>

  <div class="tabs" role="tablist" aria-label="Search mode">
    <button class="tab" role="tab" id="tab-text" aria-controls="panel-text" aria-selected="true">Describe</button>
    <button class="tab" role="tab" id="tab-image" aria-controls="panel-image" aria-selected="false" tabindex="-1">Upload a photo</button>
    <button class="tab" role="tab" id="tab-duplicates" aria-controls="panel-duplicates" aria-selected="false" tabindex="-1">Find duplicates</button>
  </div>

  <div id="unavailable" class="notice error hidden" role="alert"></div>

  <!-- Describe -->
  <section id="panel-text" role="tabpanel" aria-labelledby="tab-text">
    <form id="text-form" class="query-row" autocomplete="off">
      <label for="query" class="sr-only">Describe what you're looking for</label>
      <input id="query" class="query" type="search" placeholder="Describe what you're looking for" maxlength="500">
      <button class="btn" type="submit">Search</button>
    </form>
    <div class="suggestions">
      <span>Try:</span>
      <button class="chip" type="button">a big wild cat</button>
      <button class="chip" type="button">an animal in the snow</button>
      <button class="chip" type="button">something orange</button>
    </div>
  </section>

  <!-- Upload a photo -->
  <section id="panel-image" role="tabpanel" aria-labelledby="tab-image" class="hidden">
    <button type="button" id="drop" class="drop">
      <span class="placeholder" id="drop-placeholder" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
      </span>
      <img id="drop-preview" class="hidden" alt="">
      <span>
        <span class="drop-title" id="drop-title">Choose a photo or drop it here</span><br>
        <span class="drop-hint" id="drop-hint">JPG, PNG, WebP or BMP, up to 20 MB. Results appear as soon as it's chosen.</span>
      </span>
    </button>
    <input id="file" type="file" accept=".jpg,.jpeg,.png,.webp,.bmp,image/*" class="sr-only" tabindex="-1">
    <div class="options">
      <label><input type="checkbox" id="hide-exact" checked> Hide identical copies</label>
    </div>
  </section>

  <!-- Find duplicates -->
  <section id="panel-duplicates" role="tabpanel" aria-labelledby="tab-duplicates" class="hidden">
    <p class="tagline" style="margin-top:0">Groups photos that are nearly identical, like resized copies, re-saved exports and burst shots.</p>
    <div class="options" style="margin-top:12px">
      <label for="threshold">How similar
        <input id="threshold" type="range" min="0.80" max="1" step="0.01" value="0.95">
        <span class="threshold-value" id="threshold-value">0.95</span>
      </label>
      <button class="btn secondary" id="find-duplicates" type="button">Find duplicates</button>
    </div>
  </section>

  <div class="options" id="search-options">
    <label>Show
      <select id="top-k">
        <option value="4">4</option>
        <option value="8">8</option>
        <option value="12" selected>12</option>
        <option value="24">24</option>
        <option value="48">48</option>
      </select>
      results
    </label>
    <span id="backend-control" class="hidden">
      <span class="segmented" role="group" aria-label="Search method">
        <button type="button" data-backend="flat" aria-pressed="true">Exact</button>
        <button type="button" data-backend="hnsw" aria-pressed="false">Fast (HNSW)</button>
      </span>
    </span>
  </div>

  <div class="summary" id="summary" aria-live="polite"></div>
  <div id="results"></div>

  <footer>
    Built with OpenCLIP, FAISS and a hand-written HNSW index.
    Developers: <a href="/docs">API documentation</a>.
  </footer>
</div>

<dialog id="viewer" aria-label="Photo">
  <img id="viewer-img" alt="">
  <div class="viewer-bar">
    <span id="viewer-caption"></span>
    <button type="button" id="viewer-close">Close</button>
  </div>
</dialog>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const state = { mode: "text", backend: "flat", ready: false, file: null };

  // ---------- helpers ----------
  const fileName = (path) => path.split(/[\\/]/).pop();

  async function api(path, options) {
    const response = await fetch(path, options);
    let body = null;
    try { body = await response.json(); } catch (_) { /* not JSON */ }
    if (!response.ok) {
      let detail = body && body.detail;
      if (Array.isArray(detail)) detail = detail.map((d) => d.msg).join("; ");
      const error = new Error(detail || `The server responded with ${response.status}.`);
      error.status = response.status;
      throw error;
    }
    return body;
  }

  function setSummary(content) {
    const summary = $("summary");
    summary.replaceChildren();
    if (content) summary.append(content);
  }

  function showLoading(text) {
    const wrap = document.createElement("span");
    wrap.className = "loading";
    const spinner = document.createElement("span");
    spinner.className = "spinner";
    wrap.append(spinner, text);
    setSummary(wrap);
  }

  function showError(message) {
    setSummary("");
    const box = document.createElement("div");
    box.className = "notice error";
    box.setAttribute("role", "alert");
    box.textContent = message;
    $("results").replaceChildren(box);
  }

  function tile(result) {
    const figure = document.createElement("figure");
    figure.className = "tile";

    const button = document.createElement("button");
    button.type = "button";
    const name = fileName(result.image_path);
    button.setAttribute("aria-label", `Open ${name}`);
    const img = document.createElement("img");
    img.src = result.image_url;
    img.alt = name;
    img.loading = "lazy";
    button.append(img);
    button.addEventListener("click", () => openViewer(result));

    const caption = document.createElement("figcaption");
    const nameEl = document.createElement("span");
    nameEl.className = "name";
    nameEl.textContent = name;
    nameEl.title = name;
    const score = document.createElement("span");
    score.className = "score";
    score.textContent = result.similarity_score.toFixed(2);
    score.title = "Similarity score: higher is closer";
    caption.append(nameEl, score);

    figure.append(button, caption);
    return figure;
  }

  function grid(results) {
    const container = document.createElement("div");
    container.className = "grid";
    results.forEach((r) => container.append(tile(r)));
    return container;
  }

  function renderResults(body, what) {
    const count = body.results.length;
    if (!count) {
      setSummary("");
      const empty = document.createElement("div");
      empty.className = "notice";
      empty.textContent = "No matching photos. Try a different description or photo.";
      $("results").replaceChildren(empty);
      return;
    }
    const method = body.backend === "hnsw" ? "fast search" : "exact search";
    setSummary(`${count} ${count === 1 ? "result" : "results"} for ${what}, found in ${body.lookup_ms.toFixed(2)} ms using ${method}.`);
    $("results").replaceChildren(grid(body.results));
  }

  // ---------- viewer ----------
  function openViewer(result) {
    $("viewer-img").src = result.image_url;
    $("viewer-img").alt = fileName(result.image_path);
    $("viewer-caption").textContent =
      `${fileName(result.image_path)}, similarity ${result.similarity_score.toFixed(2)}`;
    $("viewer").showModal();
  }
  $("viewer-close").addEventListener("click", () => $("viewer").close());
  $("viewer").addEventListener("click", (e) => { if (e.target === $("viewer")) $("viewer").close(); });

  // ---------- tabs ----------
  const tabs = ["text", "image", "duplicates"];
  function selectTab(mode, focus) {
    state.mode = mode;
    tabs.forEach((t) => {
      const selected = t === mode;
      const tab = $(`tab-${t}`);
      tab.setAttribute("aria-selected", String(selected));
      tab.tabIndex = selected ? 0 : -1;
      $(`panel-${t}`).classList.toggle("hidden", !selected);
      if (selected && focus) tab.focus();
    });
    $("search-options").classList.toggle("hidden", mode === "duplicates");
    setSummary("");
    $("results").replaceChildren();
  }
  tabs.forEach((t, i) => {
    const tab = $(`tab-${t}`);
    tab.addEventListener("click", () => selectTab(t));
    tab.addEventListener("keydown", (e) => {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
      const next = (i + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length;
      selectTab(tabs[next], true);
    });
  });

  // ---------- options ----------
  document.querySelectorAll("[data-backend]").forEach((button) => {
    button.addEventListener("click", () => {
      state.backend = button.dataset.backend;
      document.querySelectorAll("[data-backend]").forEach((b) =>
        b.setAttribute("aria-pressed", String(b === button)));
      rerun();
    });
  });
  $("top-k").addEventListener("change", rerun);
  $("hide-exact").addEventListener("change", rerun);

  function rerun() {
    if (state.mode === "text" && $("query").value.trim()) searchText();
    if (state.mode === "image" && state.file) searchImage();
  }

  // ---------- describe ----------
  async function searchText() {
    const query = $("query").value.trim();
    if (!query || !state.ready) return;
    showLoading(`Searching for "${query}"…`);
    try {
      const body = await api("/search/text", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query, top_k: Number($("top-k").value), backend: state.backend }),
      });
      renderResults(body, `"${query}"`);
    } catch (error) {
      showError(error.message);
    }
  }
  $("text-form").addEventListener("submit", (e) => { e.preventDefault(); searchText(); });
  document.querySelectorAll(".chip").forEach((chip) => {
    chip.addEventListener("click", () => { $("query").value = chip.textContent; searchText(); });
  });

  // ---------- upload ----------
  function chooseFile(file) {
    if (!file) return;
    state.file = file;
    const preview = $("drop-preview");
    if (preview.src) URL.revokeObjectURL(preview.src);
    preview.src = URL.createObjectURL(file);
    preview.classList.remove("hidden");
    $("drop-placeholder").classList.add("hidden");
    $("drop-title").textContent = file.name;
    $("drop-hint").textContent = "Click or drop another photo to search again.";
    searchImage();
  }

  async function searchImage() {
    if (!state.file || !state.ready) return;
    showLoading("Finding similar photos…");
    const form = new FormData();
    form.append("file", state.file);
    form.append("top_k", $("top-k").value);
    form.append("backend", state.backend);
    form.append("exclude_exact", $("hide-exact").checked ? "true" : "false");
    try {
      const body = await api("/search/image", { method: "POST", body: form });
      renderResults(body, "your photo");
    } catch (error) {
      showError(error.message);
    }
  }

  const drop = $("drop");
  drop.addEventListener("click", () => $("file").click());
  $("file").addEventListener("change", (e) => chooseFile(e.target.files[0]));
  ["dragenter", "dragover"].forEach((type) => drop.addEventListener(type, (e) => {
    e.preventDefault(); drop.classList.add("dragging");
  }));
  ["dragleave", "drop"].forEach((type) => drop.addEventListener(type, (e) => {
    e.preventDefault(); drop.classList.remove("dragging");
  }));
  drop.addEventListener("drop", (e) => chooseFile(e.dataTransfer.files[0]));

  // ---------- duplicates ----------
  $("threshold").addEventListener("input", () => {
    $("threshold-value").textContent = Number($("threshold").value).toFixed(2);
  });

  async function findDuplicates() {
    if (!state.ready) return;
    showLoading("Comparing every photo against every other…");
    try {
      const threshold = Number($("threshold").value);
      const body = await api(`/duplicates?threshold=${threshold}`);
      if (!body.groups.length) {
        setSummary("");
        const none = document.createElement("div");
        none.className = "notice";
        none.textContent = "No near-duplicates at this setting. Move the slider left to find looser matches.";
        $("results").replaceChildren(none);
        return;
      }
      const groups = body.groups.length;
      setSummary(`${groups} ${groups === 1 ? "group" : "groups"} found. Keeping one photo from each would free up ${body.removable}.`);
      const container = document.createElement("div");
      body.groups.forEach((group, i) => {
        const section = document.createElement("section");
        section.className = "group";
        const heading = document.createElement("h2");
        heading.textContent = `Group ${i + 1}: ${group.images.length} photos`;
        section.append(heading, grid(group.images));
        container.append(section);
      });
      $("results").replaceChildren(container);
    } catch (error) {
      showError(error.message);
    }
  }
  $("find-duplicates").addEventListener("click", findDuplicates);

  // ---------- start ----------
  (async () => {
    try {
      const health = await api("/health");
      state.ready = true;
      const status = $("status");
      status.replaceChildren();
      const count = document.createElement("strong");
      count.textContent = health.image_count.toLocaleString();
      status.append(count, ` photos indexed with ${health.model_name}`);
      $("backend-control").classList.toggle("hidden", !health.hnsw_available);
      $("query").focus();
    } catch (error) {
      $("status").textContent = "No collection loaded";
      const box = $("unavailable");
      if (error.status === 503) {
        const code = (text) => { const c = document.createElement("code"); c.textContent = text; return c; };
        box.replaceChildren(
          "No photos are indexed yet. Add photos to ", code("data/images"),
          ", run ", code("python src/indexer.py"), ", then restart the server.");
      } else {
        box.textContent = `The search service isn't responding (${error.message}). Check that the server is running, then reload this page.`;
      }
      box.classList.remove("hidden");
      document.querySelectorAll("form button, .chip, #drop, #find-duplicates").forEach((b) => { b.disabled = true; });
    }
  })();
})();
</script>
</body>
</html>
